apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: staging
  name: devops
rules:
- apiGroups: [""] # "" indicates the core API group
  resources: ["*"]
  verbs: ["*"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: production
  name: devops
rules:
- apiGroups: [""] # "" indicates the core API group
  resources: ["deployments","pods","services"]
  verbs: ["get", "list", "create", "update","patch"]
