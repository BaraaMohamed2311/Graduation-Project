apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployer-role
  namespace: staging

rules:
- apiGroups: [""]
  resources: ["deployments","services","pods","configmap","secrets"]
  verbs: ["get","list","create","update","patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployer-role
  namespace: production

rules:
- apiGroups: [""]
  resources: ["deployments","services","pods","configmap","secrets"]
  verbs: ["get","list","create","update","patch"]