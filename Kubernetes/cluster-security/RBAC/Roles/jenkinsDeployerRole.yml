apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployer-role
  namespace: staging

rules:
- apiGroups: [""]
  resources:
    - services
    - pods
    - configmaps
    - secrets
  verbs:
    - get
    - list
    - create
    - update
    - patch

- apiGroups: ["apps"]
  resources:
    - deployments
    - replicasets
  verbs:
    - get
    - list
    - create
    - update
    - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployer-role
  namespace: production

rules:
- apiGroups: [""]
  resources:
    - services
    - pods
    - configmaps
    - secrets
  verbs:
    - get
    - list
    - create
    - update
    - patch

- apiGroups: ["apps"]
  resources:
    - deployments
    - replicasets
  verbs:
    - get
    - list
    - create
    - update
    - patch