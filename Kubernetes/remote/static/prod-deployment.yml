---
# Database Deployment (with persistence)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-deployment
  namespace: production
  labels:
    app: db
spec:
  replicas: 1  # ← Only 1 replica for MySQL!
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: baraamohamed/gradproj:db
        imagePullPolicy: Always
        ports:
        - containerPort: 3306  # ← MySQL port
        env:
        - name: MYSQL_DATABASE
          value: "ems_db"
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: my-secret
              key: MYSQL_ROOT_PASSWORD

---
# Hospital Client Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: production
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80   # nginx do not use it for other purposes
        - containerPort: 82   # EMS
        - containerPort: 81   # Hospital
        volumeMounts:                          # ← Correct way to mount ConfigMap
          - name: nginx-config-volume
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx-conf-file
      volumes:                                 # ← Volumes defined at pod level
        - name: nginx-config-volume
          configMap:
            name: nginx-configmap