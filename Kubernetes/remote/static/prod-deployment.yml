---
# EMS Server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems-server-deployment
  namespace: production
  labels:
    app: ems-server
spec:
  replicas: 3
  
  selector:
    matchLabels:
      app: ems-server  # ← Consistent with labels below
  template:
    metadata:
      labels:
        app: ems-server  # ← Must match selector
    spec:
      containers:
      - name: ems-server
        image: baraamohamed/gradproj:ems_server_kube
        imagePullPolicy: Always
        ports:
        - containerPort: 5500
        env:
        - name: NODE_ENV
          value: "production"
        - name: DB_HOST
          value: "db-service"  # ← Add database connection
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "ems_db"
        - name: DB_USER
          value: "root"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: my-secret
              key: MYSQL_ROOT_PASSWORD

---
# EMS Client Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
