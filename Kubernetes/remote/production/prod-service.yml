# ── DB Services ──────────────────────────────────────────────────────────
---
# Database Service (Internal only)
apiVersion: v1
kind: Service
metadata:
  name: db-service
  namespace: production
spec:
  type: ClusterIP  # ← Internal only
  selector:
    app: db  # ← Match deployment labels
  ports:
    - protocol: TCP
      port: 3306  # ← MySQL standard port
      targetPort: 3306  # ← Container port (NOT 9376!)

# ── Nginx Services ──────────────────────────────────────────────────────────
---
# nginx Service 
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: production
spec:
  type: NodePort  
  selector:
    app: nginx  
  ports:
    - name: ems
      protocol: TCP
      port: 82          # ← ClusterIP port
      targetPort: 82    # ← Container port (NGINX listens here)
      nodePort: 30600   # ← External access port (Kubernetes maps this)
    - name: hospital
      protocol: TCP
      port: 81          # ← ClusterIP port
      targetPort: 81    # ← Container port (NGINX listens here)
      nodePort: 30601   # ← External access port (Kubernetes maps this)

