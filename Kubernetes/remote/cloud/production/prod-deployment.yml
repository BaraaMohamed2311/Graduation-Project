# ── EMS Deployments ──────────────────────────────────────────────────────────

---
# EMS Server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems-server-deployment
  namespace: production
  labels:
    app: ems-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ems-server
  template:
    metadata:
      labels:
        app: ems-server
    spec:
      automountServiceAccountToken: false
      volumes:
      - name: app-secrets
        secret:
          secretName: prod-ems-server-config
      containers:
      - name: ems-server
        image: baraamohamed/gradproj:ems-server-1.0.2
        imagePullPolicy: Always
        volumeMounts:
        - name: app-secrets
          mountPath: /run/secrets
          readOnly: true
        ports:
        - containerPort: 5500
        resources:
          requests:
            memory: "110Mi"
            cpu: "40m"
          limits:
            memory: "165Mi"
            cpu: "60m"
        env:
        - name: NODE_ENV
          value: "production"
        - name: DB_HOST
          value: "db-service"
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "ems_db"
        - name: DB_USER
          value: "root"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: my-secret
              key: MYSQL_ROOT_PASSWORD

---
# EMS Client Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems-client-deployment
  namespace: production
  labels:
    app: ems-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ems-client
  template:
    metadata:
      labels:
        app: ems-client
    spec:
      containers:
      - name: ems-client
        image: baraamohamed/gradproj:ems-client-1.0.1
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "170Mi"
            cpu: "200m"
          limits:
            memory: "255Mi"
            cpu: "300m"

