# ── DB Deployment ──────────────────────────────────────────────────────────

---
# Database Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-deployment
  namespace: production
  labels:
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: baraamohamed/gradproj:db
        imagePullPolicy: Always
        ports:
        - containerPort: 3306
        resources:
          requests:
            memory: "600Mi"
            cpu: "100m"
          limits:
            memory: "930Mi"
            cpu: "150m"
        env:
        - name: MYSQL_DATABASE
          value: "ems_db"
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: my-secret
              key: MYSQL_ROOT_PASSWORD

