apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: login-register-ingress
  namespace: staging
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  ingressClassName: alb
  rules:
  - http:
      
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ems-client-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hospital-client-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: storage-client-service
            port:
              number: 80