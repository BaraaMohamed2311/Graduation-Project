# ── EMS Services ──────────────────────────────────────────────────────────
---
# EMS Server Service (Internal only)
apiVersion: v1
kind: Service
metadata:
  name: ems-server-service
  namespace: staging
spec:
  type: ClusterIP  # ← Internal only
  selector:
    app: ems-server  # ← Match deployment labels
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5500

---
# EMS Client Service (Public access)
apiVersion: v1
kind: Service
metadata:
  name: ems-client-service
  namespace: staging
spec:
  type: ClusterIP  # ← Publicly accessible
  selector:
    app: ems-client  # ← Match deployment labels
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000

