apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-ingress
  namespace: production
spec:
  ingressClassName: nginx
  rules:
  # EMS Application
  - host: ems.localhost
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: ems-server-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ems-client-service
            port:
              number: 80
  
  # Hospital Application
  - host: hospital.localhost
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: hospital-server-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hospital-client-service
            port:
              number: 80