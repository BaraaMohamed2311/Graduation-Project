# PORTS in staging are different from production to avoid conflict between them if they are on the same host staging_ports = production_ports + 100
services:

  nginx:
    restart: on-failure
    image: baraamohamed/gradproj:nginx
    ports:
      - target: 3050
        published: 3150
        protocol: tcp
        mode: ingress
      - target: 3051
        published: 3151
        protocol: tcp
        mode: ingress
    networks:
      - ems-net
      - hospital-net

  ems_server:
    image: baraamohamed/gradproj:ems-server-${EMS_SERVER_VERSION:-latest}
    deploy:
      replicas: 3
    environment:
      NODE_ENV: production
    ports:
      - target: 5500
        published: 5600
        protocol: tcp
        mode: ingress
    networks:
      - ems-net
      - db-net

  ems_client:
    image: baraamohamed/gradproj:ems-client-${EMS_CLIENT_VERSION:-latest}
    deploy:
      replicas: 3
    ports:
      - target: 3000
        published: 3100
        protocol: tcp
        mode: ingress
    networks:
      - ems-net

  hospital_server:
    image: baraamohamed/gradproj:hospital-server-${HOSPITAL_SERVER_VERSION:-latest}
    deploy:
      replicas: 3
    environment:
      NODE_ENV: production
    ports:
      - target: 8888
        published: 8988
        protocol: tcp
        mode: ingress
    networks:
      - hospital-net
      - db-net

  hospital_client:
    image: baraamohamed/gradproj:hospital-client-${HOSPITAL_CLIENT_VERSION:-latest}
    deploy:
      replicas: 3
    ports:
      - target: 3000
        published: 3101
        protocol: tcp
        mode: ingress
    networks:
      - hospital-net

  mysql_db:
    image: baraamohamed/gradproj:db
    secrets:
      - MYSQL_ROOT_PASSWORD
      - MYSQL_PASSWORD
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    networks:
      - db-net

networks:
  ems-net:
    driver: overlay
  hospital-net:
    driver: overlay
  db-net:
    driver: overlay

secrets:
  MYSQL_ROOT_PASSWORD:
    external: true
  MYSQL_PASSWORD:
    external: true