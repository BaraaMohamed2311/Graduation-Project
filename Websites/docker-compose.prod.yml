# ports must differ from staging and normal compose file deployment with no swarm to avoid conflict 
# ports in production = compose ports + 200
services:

# So host can resolve services names "ems_server" & "ems_client"
  nginx:
    depends_on:
      - hospital_client
      - hospital_server
      - ems_client
      - ems_server

    restart: on-failure
    image: baraamohamed/gradproj:nginx

    ports:
      - "3250:3050"
      - "3251:3051"


    networks:
      - ems-net
      - hospital-net


# server does envirmonet checking at server.js code
  ems_server:
    image: baraamohamed/gradproj:ems-server-${EMS_SERVER_VERSION:-latest}
    deploy:
      replicas: 3
    container_name: ems-server
    environment:
      NODE_ENV: ${NODE_ENV} # if not provided it will build development env by default
    ports:
      - 5700:5500

    networks:
      - ems-net
      - db-net




# client has to be provided with enviroment or by default it will build development env
  ems_client:
    image: baraamohamed/gradproj:ems-client-${EMS_CLIENT_VERSION:-latest}
    deploy:
      replicas: 3
    container_name: ems-client

    ports:
      - 3200:3000

    networks:
      - ems-net

  # server does envirmonet checking at server.js code
  hospital_server:
    image: baraamohamed/gradproj:hospital-server-${HOSPITAL_SERVER_VERSION:-latest}
    deploy:
      replicas: 3
    container_name: hospital-server
    environment:
      NODE_ENV: ${NODE_ENV} # if not provided it will build development env by default
    ports:
      - 9088:8888

    networks:
      - hospital-net
      - db-net




# client has to be provided with enviroment or by default it will build development env
  hospital_client:
    image: baraamohamed/gradproj:hospital-client-${HOSPITAL_CLIENT_VERSION:-latest}
    deploy:
      replicas: 3
    container_name: hospital-client
    ports:
      - 3201:3000

    networks:
      - hospital-net


  mysql_db:
    image: baraamohamed/gradproj:db
    secrets:
      - MYSQL_ROOT_PASSWORD
      - MYSQL_PASSWORD
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    container_name: cenralized_mysql


    networks:
      - db-net




networks:
  ems-net :
    driver : overlay
  hospital-net :
    driver : overlay
  db-net :
    driver : overlay

secrets:
  MYSQL_ROOT_PASSWORD:
    external: true
  MYSQL_PASSWORD:
    external: true