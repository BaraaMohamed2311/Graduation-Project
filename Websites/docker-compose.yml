
# EMS containers & Hospital containers are separated by different networks
# EMS and Hospital servers are connected to the same database network to access centralized database
services:

# So host can resolve services names "ems_server" & "ems_client" 
  nginx:

    restart: on-failure
    build:
      dockerfile: Dockerfile.dev
      context: ./nginx
    ports:
      - "3050:3050"
      - "3051:3051"
      

    networks:
      - ems-net
      - hospital-net


# server does envirmonet checking at server.js code
  ems_server:
    build: 
      context: ./ems/Server
      dockerfile: Dockerfile.backend
      args:
        - NODE_ENV=${NODE_ENV:-development} # defined in .env
    container_name: ems_server

    ports:
      - 5500:5500

    networks:
      - ems-net
      - db-net




# client has to be provided with enviroment or by default it will build development env
  ems_client:
    build: 
      context: ./ems/client
      dockerfile: Dockerfile.frontend
      target: ${NODE_ENV:-development} # defined in .env
      args:
        - NODE_ENV=${NODE_ENV}
    container_name: ems_client

    ports:
      - 3000:3000

    networks:
      - ems-net

  # server does envirmonet checking at server.js code
  hospital_server:
    build: 
      context: ./hospital/server
      dockerfile: Dockerfile.backend
      args:
        - NODE_ENV=${NODE_ENV:-development} # defined in .env
    container_name: hospital_server

    ports:
      - 8888:8888

    networks:
      - hospital-net
      - db-net




# client has to be provided with enviroment or by default it will build development env
  hospital_client:
    build: 
      context: ./hospital/client
      dockerfile: Dockerfile.frontend
      target: ${NODE_ENV:-development} # defined in .env
      args:
        - NODE_ENV=${NODE_ENV}
    container_name: hospital_client
    ports:
      - 3001:3000

    networks:
      - hospital-net
      

  mysql_db:
    build: 
      context: ./db
      dockerfile: Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    container_name: cenralized_mysql


    networks:
      - db-net




networks:
  ems-net :
    driver : bridge
  hospital-net :
    driver : bridge
  db-net :
    driver : bridge




