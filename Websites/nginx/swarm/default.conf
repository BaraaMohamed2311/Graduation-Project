# Resolver for Docker internal DNS
resolver 127.0.0.11 valid=10s ipv6=off;

# EMS upstreams (frontend still static)
upstream ems_client { server ems_client:3000; }

server {
    listen 3050;

    # Frontend
    location / {
        proxy_pass http://ems_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API - deferred DNS resolution
    location /api {
        set $ems_server_upstream http://ems_server:5500;
        proxy_pass $ems_server_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Hospital upstreams (frontend still static)
upstream hospital_client { server hospital_client:3000; }

server {
    listen 3051;

    # Frontend
    location / {
