# Resolver for Docker internal DNS
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 3050;

    # Frontend (FIXED: no upstream, use variable)
    location / {
        set $ems_client_upstream http://ems_client:3000;
        proxy_pass $ems_client_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API (already correct)
    location /api {
        set $ems_server_upstream http://ems_server:5500;
        proxy_pass $ems_server_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

