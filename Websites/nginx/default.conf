upstream ems_client {
    server ems_client:3000;
}

upstream ems_server {
    server ems_server:5500;
}

upstream hospital_client {
    server hospital_client:3001;
}

upstream hospital_server {
    server hospital_server:8888;
}

server {
    listen 80;

    # ===== EMS =====
    location /ems/ {
        proxy_pass http://ems_client/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ems/api/ {
        proxy_pass http://ems_server/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ===== HOSPITAL =====
    location /hospital/ {
        proxy_pass http://hospital_client/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hospital/api/ {
        proxy_pass http://hospital_server/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
