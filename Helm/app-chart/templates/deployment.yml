# ── EMS Deployments ──────────────────────────────────────────────────────────

---
# EMS Server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems-server-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    app: ems-server
spec:
  replicas: {{ .Values.deployments.ems.replicas.ems_server_replicas}} 
  selector:
    matchLabels:
      app: {{ .Values.deployments.ems.labels.ems_server_label}}
  template:
    metadata:
      labels:
        app: {{ .Values.deployments.ems.labels.ems_server_label}}
    spec:
      automountServiceAccountToken: false
      volumes:
        - name: app-secrets
          secret:
            secretName: prod-ems-server-config
      containers:
      - name: ems-server
        image: {{ .Values.images.ems.images.ems_server_image}}
        volumeMounts:
        - name: app-secrets
          mountPath: /run/secrets
          readOnly: true
        ports:
        - containerPort: {{ .Values.images.ems.ports.ems_server_container_port}}
        resources:
          requests:
            memory: "110Mi"   # 165Mi / 1.5

          limits:
            memory: "165Mi"

        env:
        - name: NODE_ENV
          value: "production"
        - name: DB_HOST
          value: "db-service"
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "ems_db"
        - name: DB_USER
          value: "root"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: my-secret
              key: MYSQL_ROOT_PASSWORD

---
# EMS Client Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems-client-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    app: ems-client
spec:
  replicas: {{ .Values.deployments.ems.replicas.ems_client_replicas}}
  selector:
    matchLabels:
      app: {{ .Values.deployments.ems.labels.ems_client_label}}
  template:
    metadata:
      labels:
        app: {{ .Values.deployments.ems.labels.ems_client_label}}
    spec:
      containers:
      - name: ems-client
        image: {{ .Values.images.ems.images.ems_client_image}}
        ports:
        - containerPort: {{ .Values.images.ems.ports.ems_client_container_port}}
        resources:
          requests:
            memory: "170Mi"   # 255Mi 

          limits:
            memory: "255Mi"


