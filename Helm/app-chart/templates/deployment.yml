# ── DB Deployment ──────────────────────────────────────────────────────────

---
# Database Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    app: db
spec:
  replicas: {{ .Values.deployments.db.replicas.db_replicas}}
  selector:
    matchLabels:
      app: {{ .Values.deployments.db.labels.db_label}}
  template:
    metadata:
      labels:
        app: {{ .Values.deployments.db.labels.db_label}}
    spec:
      containers:
      - name: db
        image: {{ .Values.images.db.images.db_image}}
        ports:
        - containerPort: {{ .Values.images.db.ports.db_container_port}}
        resources:
          requests:
            memory: "600Mi"

          limits:
            memory: "930Mi"

        env:
        - name: MYSQL_DATABASE
          value: "ems_db"
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: my-secret
              key: MYSQL_ROOT_PASSWORD

# ── Nginx Deployment ──────────────────────────────────────────────────────────

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    app: nginx
spec:
  replicas: {{ .Values.deployments.nginx.replicas.nginx_replicas}}
  selector:
    matchLabels:
      app: {{ .Values.deployments.nginx.labels.nginx_label}}
  template:
    metadata:
      labels:
        app: {{ .Values.deployments.nginx.labels.nginx_label}}
    spec:
      containers:
      - name: nginx
        image: {{ .Values.images.nginx.images.nginx_image}}
        ports:
        - containerPort: {{ .Values.services.nginx.ems_nginx_port}}
        - containerPort: {{ .Values.services.nginx.hospital_nginx_port}}
        resources:
          requests:
            memory: "32Mi"    # nginx is very lightweight

          limits:
            memory: "48Mi"

        volumeMounts:
          - name: nginx-config-volume
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx-conf-file
      volumes:
        - name: nginx-config-volume
          configMap:
            name: nginx-configmap