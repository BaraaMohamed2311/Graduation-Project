# ── Storage Deployments ──────────────────────────────────────────────────────────

---
# Storage Server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-server-deployment
  namespace: {{ .Values.namespace}}
  labels:
    app: storage-server
spec:
  replicas: {{ .Values.deployments.storage.replicas.storage_server_replicas}} 
  
  selector:
    matchLabels:
      app: {{ .Values.deployments.storage.labels.storage_server_label}}
  template:
    
    metadata:
      labels:
        app: {{ .Values.deployments.storage.labels.storage_server_label}}
    spec:
      automountServiceAccountToken: false
      volumes:
      - name: app-secrets
        secret:
          secretName: prod-storage-server-config
      containers:
      - name: storage-server
        image: {{ .Values.images.storage.images.storage_server_image}}
        imagePullPolicy: Always
        volumeMounts:
        - name: app-secrets
          mountPath: /run/secrets
          readOnly: true
        ports:
        - containerPort: {{ .Values.images.storage.ports.storage_server_container_port}}
        env:
        - name: NODE_ENV
          value: "production"
        - name: DB_HOST
          value: "db-service"  # ← Add database connection
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "ems_db"
        - name: DB_USER
          value: "root"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: my-secret
              key: MYSQL_ROOT_PASSWORD

---
# Storage Client Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-client-deployment
  namespace: {{ .Values.namespace}}
  labels:
    app: storage-client
spec:
  replicas: {{ .Values.deployments.storage.replicas.storage_client_replicas}}
  selector:
    matchLabels:
      app: {{ .Values.deployments.storage.labels.storage_client_label}}
  template:
    metadata:
      labels:
        app: {{ .Values.deployments.storage.labels.storage_client_label}}
    spec:
      containers:
      - name: storage-client
        image: {{ .Values.images.storage.images.storage_client_image}}
        imagePullPolicy: Always
        ports:
        - containerPort: {{ .Values.images.storage.ports.storage_client_container_port}}

# ── DB Deployment ──────────────────────────────────────────────────────────

---
# Database Deployment (with persistence)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-deployment
  namespace: {{ .Values.namespace}}
  labels:
    app: db
spec:
  replicas: {{ .Values.deployments.db.replicas.db_replicas}} 
  selector:
    matchLabels:
      app: {{ .Values.deployments.db.labels.db_label}}
  template:
    metadata:
      labels:
        app: {{ .Values.deployments.db.labels.db_label}}
    spec:
      containers:
      - name: db
        image: {{ .Values.images.db.images.db_image}} 

        ports:
        - containerPort: {{ .Values.images.db.ports.db_container_port}} 
        env:
        - name: MYSQL_DATABASE
          value: "ems_db"
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: my-secret
              key: MYSQL_ROOT_PASSWORD

# ── Nginx Deployments ──────────────────────────────────────────────────────────


---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: {{ .Values.namespace}}
  labels:
    app: nginx
spec:
  replicas: {{ .Values.deployments.nginx.replicas.nginx_replicas}} 
  selector:
    matchLabels:
      app: {{ .Values.deployments.nginx.labels.nginx_label}}
  template:
    metadata:
      labels:
        app: {{ .Values.deployments.nginx.labels.nginx_label}}
    spec:
      containers:
      - name: nginx
        image: {{ .Values.images.nginx.images.nginx_image}} 
        ports:
        - containerPort: {{ .Values.services.nginx.ems_nginx_port}}   # EMS
        - containerPort: {{ .Values.services.nginx.hospital_nginx_port}}    # Hospital
        volumeMounts:                          # ← Correct way to mount ConfigMap
          - name: nginx-config-volume
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx-conf-file
      volumes:                                 # ← Volumes defined at pod level
        - name: nginx-config-volume
          configMap:
            name: nginx-configmap