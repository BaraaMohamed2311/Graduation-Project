scrape_configs:
  - job_name: swarm-cadvisor
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock ## This is the default path for the Docker socket
        role: tasks # Prometheus discovers individual tasks/replicas. This ensures per-replica metrics are scraped.
    relabel_configs:
      - source_labels: [__meta_dockerswarm_service_name]
        regex: .*cadvisor.*
        action: keep
