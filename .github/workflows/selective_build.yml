name: Build Changed Services

on:
  push:
    branches:
      - master

jobs:
  detect-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 2  # needed to compare with previous commit

      - name: Get changed files
        id: changes
        run: |
          changed=$(git diff --name-only HEAD~1 HEAD)
          echo "all_changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$changed" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Detect changed services
        id: detect
        shell: bash
        run: |
          services=()
          files="${{ steps.changes.outputs.all_changed_files }}"
          echo "Raw changed files:"
          printf '%s\n' "$files"
          [[ $files == *"Websites/ems/client"* ]] && services+=("ems-client")
          [[ $files == *"Websites/ems/server"* ]] && services+=("ems-server")
          [[ $files == *"Websites/hospital/client"* ]] && services+=("hospital-client")
          [[ $files == *"Websites/hospital/server"* ]] && services+=("hospital-server")

          joined=$(IFS=,; echo "${services[*]}")
          echo $services
          echo "services=$joined" >> "$GITHUB_OUTPUT"

      - name: Debug before trigger
        run: |
          echo "Services output: ${{ steps.detect.outputs.services }}"
          if [ -z "${{ steps.detect.outputs.services }}" ]; then
            echo "WARNING: services is empty, Jenkins will not be triggered"
          else
            echo "OK: services has value, Jenkins will be triggered"
          fi
        
      - name: Trigger Jenkins Docker Compose Build
        uses: appleboy/jenkins-action@v1
        with:
          url: ${{ secrets.JENKINS_URL }}
          user: ${{ secrets.JENKINS_USER }}
          token: ${{ secrets.JENKINS_TOKEN }} 
          job: ${{ secrets.JENKINS_JOB_NAME }}
          parameters: |
            SERVICES=${{ steps.detect.outputs.services }}

